name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint PHP
        run: composer lint
      - name: Run dependency-free smoke tests
        run: composer test
      - name: Parse checkout JavaScript
        run: node --check assets/js/checkout-blocks.js
